<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruto CCG Deckbuilder</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1e1e24;
            --accent-color: #ff6b00;
            --text-color: #e1e1e6;
            --border-color: #2e2e38;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input, select {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: 1px solid var(--accent-color);
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            max-height: 80vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .card-item {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.15s ease, border-color 0.15s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card-item:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .card-item img {
            width: 100%;
            height: auto;
            display: block;
            background-color: #000;
        }

        .card-info {
            padding: 8px;
            font-size: 0.8rem;
        }

        .card-title {
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            color: #a0a0b0;
            margin-top: 4px;
        }

        .deck-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stats-badge {
            font-size: 0.75rem;
            background: #2a2a35;
            padding: 2px 6px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Naruto CCG Deckbuilder</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search by name or number...">
            <select id="setFilter">
                <option value="">All Sets</option>
            </select>
            <select id="symbolFilter">
                <option value="">All Symbols</option>
                <option value="Fire">Fire</option>
                <option value="Water">Water</option>
                <option value="Lightning">Lightning</option>
                <option value="Wind">Wind</option>
                <option value="Earth">Earth</option>
                <option value="Void">Void</option>
            </select>
        </div>
    </header>

    <div class="layout">
        <main class="card-grid" id="cardGrid">
            <!-- Cards populated dynamically -->
        </main>

        <aside class="deck-panel">
            <h2>Current Deck</h2>
            <div id="deckStats">Total Cards: 0</div>
            <ul id="deckList" style="list-style: none; padding: 0;">
                <!-- Deck items populated dynamically -->
            </ul>
        </aside>
    </div>

    <script>
        let cardDatabase = [];
        let currentDeck = [];

        // Fetch cards directly from exports/card_database.json
        async function loadCards() {
            try {
                const response = await fetch('exports/card_database.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const rawCards = await response.json();

                // Normalize image paths relative to project root
                cardDatabase = rawCards.map(card => {
                    let imgPath = card.image_path || '';
                    if (imgPath && !imgPath.startsWith('cards_database/')) {
                        imgPath = `cards_database/${imgPath}`;
                    }
                    return {
                        ...card,
                        image_path: imgPath
                    };
                });

                populateSetFilter();
                renderCards(cardDatabase);
            } catch (error) {
                console.error("Failed to load database from exports/card_database.json:", error);
                document.getElementById('cardGrid').innerHTML = `<p style="color: #ff4444;">Error loading database (exports/card_database.json). Run pipeline to generate JSON.</p>`;
            }
        }

        function populateSetFilter() {
            const setFilter = document.getElementById('setFilter');
            const sets = [...new Set(cardDatabase.map(c => c.card_set).filter(Boolean))];
            
            sets.forEach(setName => {
                const option = document.createElement('option');
                option.value = setName;
                option.textContent = setName;
                setFilter.appendChild(option);
            });
        }

        function renderCards(cardsToRender) {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            if (cardsToRender.length === 0) {
                grid.innerHTML = '<p>No cards match the selected filters.</p>';
                return;
            }

            cardsToRender.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card-item';
                cardEl.innerHTML = `
                    <img src="${card.image_path}" alt="${card.card_name}" loading="lazy" onerror="this.src='https://via.placeholder.com/160x220?text=No+Image'">
                    <div class="card-info">
                        <div class="card-title">${card.card_name || 'Unknown Card'}</div>
                        <div class="card-meta">
                            <span>${card.card_number || ''}</span>
                            <span class="stats-badge">${card.symbol || 'None'}</span>
                        </div>
                    </div>
                `;
                cardEl.addEventListener('click', () => addToDeck(card));
                grid.appendChild(cardEl);
            });
        }

        function filterCards() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedSet = document.getElementById('setFilter').value;
            const selectedSymbol = document.getElementById('symbolFilter').value;

            const filtered = cardDatabase.filter(card => {
                const nameMatch = (card.card_name || '').toLowerCase().includes(searchTerm);
                const codeMatch = (card.card_number || '').toLowerCase().includes(searchTerm);
                const setMatch = !selectedSet || card.card_set === selectedSet;
                const symbolMatch = !selectedSymbol || (card.symbol || '').toLowerCase() === selectedSymbol.toLowerCase();

                return (nameMatch || codeMatch) && setMatch && symbolMatch;
            });

            renderCards(filtered);
        }

        function addToDeck(card) {
            currentDeck.push(card);
            updateDeckUI();
        }

        function updateDeckUI() {
            document.getElementById('deckStats').textContent = `Total Cards: ${currentDeck.length}`;
            const list = document.getElementById('deckList');
            list.innerHTML = '';

            const counts = {};
            currentDeck.forEach(c => {
                const key = `${c.card_name} (${c.card_number})`;
                counts[key] = (counts[key] || 0) + 1;
            });

            Object.entries(counts).forEach(([name, count]) => {
                const li = document.createElement('li');
                li.textContent = `${count}x ${name}`;
                li.style.padding = '4px 0';
                li.style.borderBottom = '1px solid var(--border-color)';
                list.appendChild(li);
            });
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', filterCards);
        document.getElementById('setFilter').addEventListener('change', filterCards);
        document.getElementById('symbolFilter').addEventListener('change', filterCards);

        // Initial Load
        document.addEventListener('DOMContentLoaded', loadCards);
    </script>
</body>
</html>
