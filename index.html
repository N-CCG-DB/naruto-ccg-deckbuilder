<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naruto CCG Deck Builder</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --border-color: #333333;
      --text-color: #e0e0e0;
      --accent-color: #ff9800;
      --accent-hover: #e68a00;
      --btn-danger: #d32f2f;
      --btn-success: #388e3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Control Bar */
    header {
      background-color: var(--panel-bg);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input, select {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 4px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    /* Main Container Layout */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left: Card Grid */
    .card-browser {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    .card-item {
      background-color: var(--panel-bg);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.1s ease;
    }

    .card-item:hover {
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }

    .card-item img {
      width: 100%;
      height: auto;
      aspect-ratio: 750 / 1050;
      background-color: #1a1a1a;
      object-fit: cover;
      display: block;
    }

    .card-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #181818;
      border-top: 1px solid var(--border-color);
    }

    .card-controls button {
      background-color: #333;
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-controls button:hover {
      background-color: var(--accent-color);
    }

    .card-qty {
      font-weight: bold;
      color: var(--accent-color);
    }

    /* Middle: Card Inspector */
    .card-inspector {
      width: 320px;
      background-color: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }

    .inspector-img {
      width: 100%;
      border-radius: 6px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .inspector-details {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
    }

    .inspector-details h4 {
      color: var(--accent-color);
      font-size: 18px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      background: #262626;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .placeholder-text {
      color: #777;
      text-align: center;
      margin-top: 50px;
    }

    /* Right: Decklist Sidebar */
    .decklist-sidebar {
      width: 320px;
      background-color: var(--panel-bg);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .deck-items {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .deck-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background-color: #262626;
      border-radius: 4px;
      border: 1px solid #333;
    }

    .deck-qty {
      font-weight: bold;
      color: var(--accent-color);
      min-width: 24px;
    }

    .deck-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      font-size: 14px;
    }

    .deck-name:hover {
      text-decoration: underline;
      color: #fff;
    }

    .deck-entry-controls {
      display: flex;
      gap: 4px;
    }

    .deck-entry-controls button {
      background-color: #3a3a3a;
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 3px;
      cursor: pointer;
    }

    .deck-entry-controls button:hover {
      background-color: var(--accent-color);
    }

    .export-btn {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s;
    }

    .export-btn:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>

  <!-- Search & Filter Header -->
  <header>
    <div class="filter-group">
      <label for="search-input">Search:</label>
      <input type="text" id="search-input" placeholder="Name or Card #..." oninput="filterCards()" />
    </div>
    
    <div class="filter-group">
      <label for="type-filter">Type:</label>
      <select id="type-filter" onchange="filterCards()">
        <option value="ALL">All Types</option>
        <option value="Ninja">Ninja</option>
        <option value="Jutsu">Jutsu</option>
        <option value="Mission">Mission</option>
        <option value="Client">Client</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="set-filter">Set:</label>
      <select id="set-filter" onchange="filterCards()">
        <option value="ALL">All Sets</option>
      </select>
    </div>
  </header>

  <!-- App Body Layout -->
  <div class="app-container">
    
    <!-- Left: Card Grid -->
    <section class="card-browser">
      <div id="card-grid" class="card-grid"></div>
    </section>

    <!-- Middle: Card Inspector Panel -->
    <aside class="card-inspector">
      <h3>Card Inspector</h3>
      <div id="inspector-content">
        <p class="placeholder-text">Click any card to view stats and text</p>
      </div>
    </aside>

    <!-- Right: Aggregated Decklist -->
    <aside class="decklist-sidebar">
      <h3>Deck (<span id="deck-count">0</span>)</h3>
      <div id="deck-items" class="deck-items"></div>
      <button onclick="exportToTTS()" class="export-btn">Export to TTS</button>
    </aside>

  </div>

  <script>
    let cardDatabase = [];
    let currentDeck = {};

    function getCardImageUrl(card) {
      return `./naruto_ccg_sets_database/${card.setfolder}/${card.imgname}`;
    }

    async function initApp() {
      try {
        const response = await fetch('cards.json');
        cardDatabase = await response.json();
        
        populateSetFilter();
        filterCards();
      } catch (err) {
        console.error("Failed to load cards.json:", err);
      }
    }

    function populateSetFilter() {
      const setSelect = document.getElementById('set-filter');
      
      // Get unique sets using the clean 'set' property or fallback to 'setfolder'
      const setMap = new Map();
      cardDatabase.forEach(c => {
        if (c.setfolder) {
          const displayName = c.set || c.setfolder.replace(/_/g, ' ');
          setMap.set(c.setfolder, displayName);
        }
      });

      Array.from(setMap.entries()).sort((a,b) => a[1].localeCompare(b[1])).forEach(([folder, name]) => {
        const opt = document.createElement('option');
        opt.value = folder;
        opt.textContent = name;
        setSelect.appendChild(opt);
      });
    }

    function getFilteredCards() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const selectedSet = document.getElementById('set-filter').value;
      const selectedType = document.getElementById('type-filter').value;

      return cardDatabase.filter(card => {
        const nameMatch = card.name ? card.name.toLowerCase().includes(query) : false;
        const numberMatch = card.cardnumber ? card.cardnumber.toLowerCase().includes(query) : false;
        const matchesQuery = nameMatch || numberMatch;

        const matchesSet = (selectedSet === 'ALL') || (card.setfolder === selectedSet);
        const matchesType = (selectedType === 'ALL') || (card.cardtype && card.cardtype.toLowerCase() === selectedType.toLowerCase());

        return matchesQuery && matchesSet && matchesType;
      });
    }

    function filterCards() {
      renderCards(getFilteredCards());
    }

    function renderCards(cardsToRender) {
      const grid = document.getElementById('card-grid');
      grid.innerHTML = '';

      cardsToRender.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card-item';
        cardEl.onclick = () => inspectCard(card);

        const countInDeck = currentDeck[card.cardnumber] ? currentDeck[card.cardnumber].count : 0;

        cardEl.innerHTML = `
          <img 
            src="${getCardImageUrl(card)}" 
            alt="${card.name}" 
            loading="lazy" 
            width="750" 
            height="1050"
          />
          <div class="card-controls" onclick="event.stopPropagation()">
            <button onclick="removeCard('${card.cardnumber}')">-</button>
            <span class="card-qty">${countInDeck}</span>
            <button onclick="addCard('${card.cardnumber}')">+</button>
          </div>
        `;
        grid.appendChild(cardEl);
      });
    }

    function addCard(cardNumber) {
      const card = cardDatabase.find(c => c.cardnumber === cardNumber);
      if (!card) return;

      if (currentDeck[cardNumber]) {
        currentDeck[cardNumber].count += 1;
      } else {
        currentDeck[cardNumber] = { card: card, count: 1 };
      }
      updateUI();
    }

    function removeCard(cardNumber) {
      if (!currentDeck[cardNumber]) return;

      currentDeck[cardNumber].count -= 1;
      if (currentDeck[cardNumber].count <= 0) {
        delete currentDeck[cardNumber];
      }
      updateUI();
    }

    function inspectCard(card) {
      const inspector = document.getElementById('inspector-content');
      
      inspector.innerHTML = `
        <img src="${getCardImageUrl(card)}" class="inspector-img" alt="${card.name}" />
        <div class="inspector-details">
          <h4>${card.name || 'Unknown'}</h4>
          <p><strong>Card Number:</strong> ${card.cardnumber || '-'}</p>
          <p><strong>Type:</strong> ${card.cardtype || '-'}</p>
          <p><strong>Set:</strong> ${card.set || card.setfolder || '-'}</p>
          ${card.symbol ? `<p><strong>Symbol:</strong> ${card.symbol}</p>` : ''}
          ${card.entrancecost !== '' ? `<p><strong>Entrance Cost:</strong> ${card.entrancecost}</p>` : ''}
          ${card.handcost !== '' ? `<p><strong>Hand Cost:</strong> ${card.handcost}</p>` : ''}
          ${(card.combath || card.supporth) ? `
            <div class="stat-row">
              <span><strong>Healthy:</strong> ${card.combath || '-'}/${card.supporth || '-'}</span>
              <span><strong>Injured:</strong> ${card.combati || '-'}/${card.supporti || '-'}</span>
            </div>
          ` : ''}
          ${card.attribute ? `<p><strong>Attributes:</strong> ${card.attribute}</p>` : ''}
          ${card.effect ? `<p><strong>Effect:</strong> ${card.effect}</p>` : ''}
          ${card.flavor ? `<p><em>"${card.flavor}"</em></p>` : ''}
        </div>
      `;
    }

    function renderDecklist() {
      const container = document.getElementById('deck-items');
      const countEl = document.getElementById('deck-count');
      container.innerHTML = '';

      let totalCards = 0;

      Object.values(currentDeck).forEach(entry => {
        totalCards += entry.count;
        const item = document.createElement('div');
        item.className = 'deck-entry';
        item.innerHTML = `
          <span class="deck-qty">${entry.count}x</span>
          <span class="deck-name" onclick="inspectCard(currentDeck['${entry.card.cardnumber}'].card)">
            ${entry.card.name}
          </span>
          <div class="deck-entry-controls">
            <button onclick="removeCard('${entry.card.cardnumber}')">-</button>
            <button onclick="addCard('${entry.card.cardnumber}')">+</button>
          </div>
        `;
        container.appendChild(item);
      });

      countEl.innerText = totalCards;
    }

    function updateUI() {
      renderDecklist();
      renderCards(getFilteredCards());
    }

    function exportToTTS() {
      const deckArray = [];
      
      Object.values(currentDeck).forEach(entry => {
        for (let i = 0; i < entry.count; i++) {
          deckArray.push(entry.card);
        }
      });

      if (deckArray.length === 0) {
        alert("Deck is empty!");
        return;
      }

      const baseURL = window.location.origin + window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
      const cardBackURL = `${baseURL}/cardback.webp`;
      const customDeckDict = {};
      const containedObjects = [];
      const deckIDs = [];

      deckArray.forEach((card, index) => {
        const cardId = (index + 1) * 100;
        const cleanImgPath = getCardImageUrl(card).replace(/^\.\//, '');
        const fullImageUrl = `${baseURL}/${cleanImgPath}`;

        deckIDs.push(cardId);

        customDeckDict[index + 1] = {
          "FaceURL": fullImageUrl,
          "BackURL": cardBackURL,
          "NumWidth": 1,
          "NumHeight": 1,
          "BackIsHidden": true,
          "UniqueBack": false
        };

        containedObjects.push({
          "Name": "Card",
          "Transform": {
            "posX": 0, "posY": 0, "posZ": 0,
            "rotX": 0, "rotY": 180, "rotZ": 180,
            "scaleX": 1, "scaleY": 1, "scaleZ": 1
          },
          "Nickname": card.name,
          "Description": card.cardnumber,
          "CardID": cardId,
          "CustomDeck": {
            [index + 1]: customDeckDict[index + 1]
          }
        });
      });

      const ttsSaveObject = {
        "SaveName": "",
        "GameMode": "",
        "Date": "",
        "ObjectStates": [
          {
            "Name": "DeckCustom",
            "Transform": {
              "posX": 0, "posY": 1, "posZ": 0,
              "rotX": 0, "rotY": 180, "rotZ": 180,
              "scaleX": 1, "scaleY": 1, "scaleZ": 1
            },
            "Nickname": "Naruto CCG Deck",
            "Description": "Exported from Naruto CCG Deckbuilder",
            "DeckIDs": deckIDs,
            "CustomDeck": customDeckDict,
            "ContainedObjects": containedObjects
          }
        ]
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(ttsSaveObject, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "naruto_deck.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    window.onload = initApp;
  </script>
</body>
</html>
