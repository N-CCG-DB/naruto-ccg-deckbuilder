<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naruto CCG Deckbuilder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #2b2b2b;
      padding: 15px 20px;
      border-bottom: 2px solid #ff9900;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    header input, header select {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #333;
      color: white;
    }
    header input { flex-grow: 1; min-width: 200px; }
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .card-grid {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      align-content: start;
    }
    .card-item {
      background: #2b2b2b;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card-item img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      object-fit: cover;
    }
    .card-item button {
      margin-top: 8px;
      width: 100%;
      background: #ff9900;
      color: black;
      font-weight: bold;
      border: none;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .card-item button:hover { background: #e68a00; }
    .sidebar {
      width: 320px;
      background: #222;
      border-left: 2px solid #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .deck-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 0;
      margin: 15px 0;
    }
    .deck-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: #2c2c2c;
      margin-bottom: 5px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .export-btn {
      background: #28a745;
      color: white;
      padding: 10px;
      border: none;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    .export-btn:hover { background: #218838; }
  </style>
</head>
<body>

  <header>
    <h2>Naruto CCG</h2>
    <input type="text" id="search-input" onkeyup="filterCards()" placeholder="Search card name, number, or characteristics...">
    
    <select id="set-filter" onchange="filterCards()">
      <option value="ALL">All Sets</option>
    </select>

    <select id="type-filter" onchange="filterCards()">
      <option value="ALL">All Types</option>
      <option value="Ninja">Ninja</option>
      <option value="Jutsu">Jutsu</option>
      <option value="Mission">Mission</option>
      <option value="Client">Client</option>
    </select>
  </header>

  <div class="app-container">
    <div id="card-grid" class="card-grid">
      <p>Loading database...</p>
    </div>

    <div class="sidebar">
      <h3>Deck (<span id="deck-count">0</span>)</h3>
      <ul id="deck-list" class="deck-list"></ul>
      <button class="export-btn" onclick="exportToTTS()">Export to TTS</button>
    </div>
  </div>

  <script>
    let cardDatabase = [];
    let currentDeck = [];

    function getCardImageUrl(card) {
      return `./Naruto_CCG_Sets_Database/${card.setFolder}/${card.imgName}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      fetch('./cards.json')
        .then(res => {
          if (!res.ok) throw new Error("Could not load cards.json");
          return res.json();
        })
        .then(data => {
          cardDatabase = data;
          initFilters();
          renderCards(cardDatabase);
        })
        .catch(err => {
          console.error("Error loading cards:", err);
          document.getElementById('card-grid').innerHTML = 
            `<p style="color: #ff4444;">Failed to load card database.<br>Error: ${err.message}</p>`;
        });
    });

    function initFilters() {
      const setSelect = document.getElementById('set-filter');
      setSelect.innerHTML = '<option value="ALL">All Sets</option>';
      const sets = [...new Set(cardDatabase.map(c => c.setFolder))];
      sets.forEach(sf => {
        const opt = document.createElement('option');
        opt.value = sf;
        opt.textContent = sf.replace(/_/g, ' ').toUpperCase();
        setSelect.appendChild(opt);
      });
    }

    function renderCards(cards) {
      const grid = document.getElementById('card-grid');
      grid.innerHTML = '';

      if (cards.length === 0) {
        grid.innerHTML = '<p>No cards match your filter criteria.</p>';
        return;
      }

      cards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'card-item';
        div.innerHTML = `
          <img src="${getCardImageUrl(card)}" alt="${card.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/140x200?text=Image+Missing';">
          <small style="margin-top:5px;"><strong>${card.name}</strong></small>
          <small style="color:#aaa;">${card.cardNumber} • ${card.cardType}</small>
          <button onclick="addToDeck('${card.cardNumber}')">+ Add</button>
        `;
        grid.appendChild(div);
      });
    }

    function filterCards() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const selectedSet = document.getElementById('set-filter').value;
      const selectedType = document.getElementById('type-filter').value;

      const filtered = cardDatabase.filter(card => {
        const matchesNameOrNumber = card.name.toLowerCase().includes(query) || 
                                    card.cardNumber.toLowerCase().includes(query) ||
                                    (card.characteristics && card.characteristics.toLowerCase().includes(query));
        const matchesSet = (selectedSet === 'ALL') || (card.setFolder === selectedSet);
        const matchesType = (selectedType === 'ALL') || (card.cardType === selectedType);

        return matchesNameOrNumber && matchesSet && matchesType;
      });

      renderCards(filtered);
    }

    function addToDeck(cardNumber) {
      const card = cardDatabase.find(c => c.cardNumber === cardNumber);
      if (card) {
        currentDeck.push(card);
        updateDeckUI();
      }
    }

    function updateDeckUI() {
      const list = document.getElementById('deck-list');
      document.getElementById('deck-count').innerText = currentDeck.length;
      list.innerHTML = '';
      currentDeck.forEach((card, index) => {
        const li = document.createElement('li');
        li.className = 'deck-item';
        li.innerHTML = `
          <span>${card.name} (${card.cardType})</span>
          <button style="background:none; border:none; color:#ff4444; cursor:pointer;" onclick="removeFromDeck(${index})">❌</button>
        `;
        list.appendChild(li);
      });
    }

    function removeFromDeck(index) {
      currentDeck.splice(index, 1);
      updateDeckUI();
    }

    function exportToTTS() {
      if (currentDeck.length === 0) return alert("Add at least 1 card to export!");

      const customDeckMap = {};
      const containedObjects = [];
      const deckIDs = [];
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);

      currentDeck.forEach((card, i) => {
        const deckIdNumber = i + 1;
        const fullCardId = deckIdNumber * 100;
        const fullOnlineImgUrl = baseUrl + `Naruto_CCG_Sets_Database/${card.setFolder}/${card.imgName}`;

        customDeckMap[deckIdNumber] = {
          FaceURL: fullOnlineImgUrl,
          BackURL: "https://i.imgur.com/2bXfA9M.jpg",
          NumWidth: 1, NumHeight: 1, BackIsHidden: true, UniqueBack: false
        };

        deckIDs.push(fullCardId);
        containedObjects.push({
          Name: "Card", Nickname: card.name, CardID: fullCardId,
          Transform: { posX: 0, posY: 1, posZ: 0, rotX: 0, rotY: 180, rotZ: 0, scaleX: 1, scaleY: 1, scaleZ: 1 },
          CustomDeck: { [deckIdNumber]: customDeckMap[deckIdNumber] }
        });
      });

      const ttsJson = {
        ObjectStates: [{
          Name: "DeckCustom", Nickname: "Naruto CCG Deck",
          Transform: { posX: 0, posY: 1, posZ: 0, rotX: 0, rotY: 180, rotZ: 180, scaleX: 1, scaleY: 1, scaleZ: 1 },
          CustomDeck: customDeckMap, DeckIDs: deckIDs, ContainedObjects: containedObjects
        }]
      };

      const blob = new Blob([JSON.stringify(ttsJson, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "Naruto_Deck.json";
      a.click();
    }
  </script>
</body>
</html>
