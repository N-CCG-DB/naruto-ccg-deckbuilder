<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Naruto CCG Deckbuilder</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { display: flex; height: 100vh; margin: 0; background: #1e1e24; color: #fff; }
    #search-panel { flex: 3; padding: 20px; overflow-y: auto; border-right: 2px solid #333; }
    #deck-panel { flex: 1; padding: 20px; background: #18181c; display: flex; flex-direction: column; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    input, select { padding: 10px; background: #2a2a32; color: #fff; border: 1px solid #444; border-radius: 4px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    .card-item { background: #2a2a32; padding: 8px; border-radius: 6px; text-align: center; display: flex; flex-direction: column; justify: space-between; }
    .card-item img { width: 100%; border-radius: 4px; height: 190px; object-fit: cover; }
    .card-item button { margin-top: 5px; width: 100%; padding: 6px; background: #ff9900; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .deck-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; }
    .deck-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #333; }
    .remove-btn { background: #ff4444; border: none; color: white; padding: 4px 8px; cursor: pointer; border-radius: 4px; }
    .export-btn { padding: 15px; background: #00cc66; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- LEFT PANEL: Card Search & Filtering -->
  <div id="search-panel">
    <h2>Naruto CCG Database</h2>
    <div class="controls">
      <!-- Search Input -->
      <input type="text" id="search-input" placeholder="Search card by name..." oninput="filterCards()">
      
      <!-- Set Filter -->
      <select id="set-filter" onchange="filterCards()">
        <option value="ALL">All Sets</option>
      </select>

      <!-- Card Type Filter -->
      <select id="type-filter" onchange="filterCards()">
        <option value="ALL">All Card Types</option>
        <option value="Ninja">Ninja</option>
        <option value="Jutsu">Jutsu</option>
        <option value="Mission">Mission</option>
        <option value="Client">Client</option>
      </select>
    </div>

    <div class="card-grid" id="card-grid"></div>
  </div>

  <!-- RIGHT PANEL: Current Deck & TTS Export -->
  <div id="deck-panel">
    <h2>Current Deck (<span id="deck-count">0</span>)</h2>
    <ul class="deck-list" id="deck-list"></ul>
    <button class="export-btn" onclick="exportToTTS()">Export to Tabletop Simulator</button>
  </div>

  <script>
    // ==========================================
    // CARD DATABASE PLACEHOLDERS
    // Replace folder names, image names, and values below!
    // ==========================================
    let cardDatabase = [
      { 
        id: "N-001", 
        name: "Naruto Uzumaki", 
        type: "Ninja", 
        setFolder: "Set_1_Path_of_the_Hokage", 
        imgName: "n001.jpg" 
      },
      { 
        id: "N-002", 
        name: "Sasuke Uchiha", 
        type: "Ninja", 
        setFolder: "Set_1_Path_of_the_Hokage", 
        imgName: "n002.jpg" 
      },
      { 
        id: "J-001", 
        name: "Kunai", 
        type: "Jutsu", 
        setFolder:  "Set_1_Path_of_the_Hokage", 
        imgName: "j001.jpg" 
      },
      { 
        id: "M-001", 
        name: "Ichiraku Noodle Shop", 
        type: "Mission", 
        setFolder: "Set_1_Path_of_the_Hokage", 
        imgName: "m001.jpg" 
      },
      { 
        id: "C-001", 
        name: "Inari", 
        type: "Client", 
        setFolder: "Set_2_Coils_of_the_Snake", 
        imgName: "c001.jpg" 
      }
    ];

    let currentDeck = [];

    // Construct image URL pointing to Naruto_CCG_Sets_Database
    function getCardImageUrl(card) {
      return `./Naruto_CCG_Sets_Database/${card.setFolder}/${card.imgName}`;
    }

    // Populate the Set Dropdown automatically based on the database
    function initSetFilter() {
      const setSelect = document.getElementById('set-filter');
      const sets = [...new Set(cardDatabase.map(c => c.setFolder))];
      sets.forEach(setFolder => {
        const option = document.createElement('option');
        option.value = setFolder;
        option.textContent = setFolder.replace(/_/g, ' ').toUpperCase();
        setSelect.appendChild(option);
      });
    }

    // Render cards to the UI
    function renderCards(cards) {
      const grid = document.getElementById('card-grid');
      grid.innerHTML = '';
      
      if (cards.length === 0) {
        grid.innerHTML = '<p>No cards match your filter criteria.</p>';
        return;
      }

      cards.forEach(card => {
        const imgUrl = getCardImageUrl(card);
        const div = document.createElement('div');
        div.className = 'card-item';
        div.innerHTML = `
          <img src="${imgUrl}" alt="${card.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/140x200?text=Card+Image+Missing';">
          <small><strong>${card.name}</strong></small>
          <small style="color: #aaa;">${card.type}</small>
          <button onclick="addToDeck('${card.id}')">+ Add</button>
        `;
        grid.appendChild(div);
      });
    }

    // Filter cards by Search Query, Set Folder, and Card Type
    function filterCards() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const selectedSet = document.getElementById('set-filter').value;
      const selectedType = document.getElementById('type-filter').value;

      const filtered = cardDatabase.filter(card => {
        const matchesName = card.name.toLowerCase().includes(query);
        const matchesSet = (selectedSet === 'ALL') || (card.setFolder === selectedSet);
        const matchesType = (selectedType === 'ALL') || (card.type === selectedType);
        
        return matchesName && matchesSet && matchesType;
      });

      renderCards(filtered);
    }

    // Add card to current deck
    function addToDeck(cardId) {
      const card = cardDatabase.find(c => c.id === cardId);
      if (card) {
        currentDeck.push(card);
        updateDeckUI();
      }
    }

    // Update Deck Sidebar UI
    function updateDeckUI() {
      const list = document.getElementById('deck-list');
      document.getElementById('deck-count').innerText = currentDeck.length;
      list.innerHTML = '';
      currentDeck.forEach((card, index) => {
        const li = document.createElement('li');
        li.className = 'deck-item';
        li.innerHTML = `
          <span>${card.name} (${card.type})</span> 
          <button class="remove-btn" onclick="removeFromDeck(${index})">❌</button>
        `;
        list.appendChild(li);
      });
    }

    // Remove card from current deck
    function removeFromDeck(index) {
      currentDeck.splice(index, 1);
      updateDeckUI();
    }

    // Export current deck to Tabletop Simulator JSON format
    function exportToTTS() {
      if (currentDeck.length === 0) return alert("Add at least 1 card to export!");

      const customDeckMap = {};
      const containedObjects = [];
      const deckIDs = [];

      // Get base URL for live GitHub Pages deployment
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);

      currentDeck.forEach((card, i) => {
        const deckIdNumber = i + 1;
        const fullCardId = deckIdNumber * 100;
        
        // Exact online link for TTS image loading
        const fullOnlineImgUrl = baseUrl + `Naruto_CCG_Sets_Database/${card.setFolder}/${card.imgName}`;

        customDeckMap[deckIdNumber] = {
          FaceURL: fullOnlineImgUrl,
          BackURL: "https://i.imgur.com/2bXfA9M.jpg", // Default Naruto CCG card back
          NumWidth: 1, 
          NumHeight: 1, 
          BackIsHidden: true, 
          UniqueBack: false
        };

        deckIDs.push(fullCardId);
        containedObjects.push({
          Name: "Card", 
          Nickname: card.name, 
          CardID: fullCardId,
          Transform: { posX: 0, posY: 1, posZ: 0, rotX: 0, rotY: 180, rotZ: 0, scaleX: 1, scaleY: 1, scaleZ: 1 },
          CustomDeck: { [deckIdNumber]: customDeckMap[deckIdNumber] }
        });
      });

      const ttsJson = {
        ObjectStates: [{
          Name: "DeckCustom",
          Nickname: "Naruto CCG Deck",
          Transform: { posX: 0, posY: 1, posZ: 0, rotX: 0, rotY: 180, rotZ: 180, scaleX: 1, scaleY: 1, scaleZ: 1 },
          CustomDeck: customDeckMap,
          DeckIDs: deckIDs,
          ContainedObjects: containedObjects
        }]
      };

      const blob = new Blob([JSON.stringify(ttsJson, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "Naruto_Deck.json";
      a.click();
    }

    // Initialize layout on DOM ready
    document.addEventListener("DOMContentLoaded", () => {
      initSetFilter();
      renderCards(cardDatabase);
    });
  </script>
</body>
</html>
