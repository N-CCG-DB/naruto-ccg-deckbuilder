<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naruto CCG Deck Builder</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --border-color: #333333;
      --text-color: #e0e0e0;
      --accent-color: #ff9800;
      --accent-hover: #e68a00;
      --scrollbar-bg: #1a1a1a;
      --scrollbar-thumb: #444444;
      --scrollbar-thumb-hover: #666666;

      --color-main: #ff9800;
      --color-reinf: #4fc3f7;
      --color-side: #f48fb1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, .card-item, .deck-entry, .target-btn, .card-controls, .btn, header {
      user-select: none;
      -webkit-user-select: none;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-bg); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 5px; border: 2px solid var(--scrollbar-bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
    * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-bg); }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--panel-bg);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-group { display: flex; align-items: center; gap: 8px; }

    input, select {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 4px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    input:focus, select:focus { border-color: var(--accent-color); }

    /* ---------- Layout ---------- */
    .app-container { display: flex; flex: 1; overflow: hidden; position: relative; }

    .card-inspector {
      width: 420px;
      min-width: 240px;
      max-width: 60vw;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .inspector-img {
      width: 100%;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6);
      display: block;
    }

    .inspector-details { display: flex; flex-direction: column; gap: 10px; font-size: 14px; user-select: text; -webkit-user-select: text; }
    .inspector-details h4 { color: var(--accent-color); font-size: 24px; margin-top: 15px; margin-bottom: 5px; line-height: 1.2; }
    .inspector-details p { word-break: break-word; line-height: 1.4; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      background: #262626;
      padding: 6px 10px;
      border-radius: 4px;
    }

    /* Effect block: preserves \n line breaks from the source data */
    .effect-block {
      background: #262626;
      padding: 8px 10px;
      border-radius: 4px;
      white-space: pre-line;
      line-height: 1.45;
      font-size: 13px;
    }
    .effect-block .effect-title {
      display: block;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .placeholder-text { color: #777; text-align: center; margin-top: 50px; }

    .card-browser { flex: 1; padding: 15px; overflow-y: auto; min-width: 200px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }

    .card-item {
      background-color: var(--panel-bg);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.1s ease;
    }

    .card-item:hover { transform: translateY(-2px); border-color: var(--accent-color); }

    .card-item img {
      width: 100%;
      height: auto;
      aspect-ratio: 750 / 1050;
      background-color: #1a1a1a;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .card-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #181818;
      border-top: 1px solid var(--border-color);
      min-height: 40px;
    }

    .card-controls button {
      background-color: #333;
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-controls button:hover { background-color: var(--accent-color); color: #000; }

    .card-qty {
      font-weight: bold;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* ---------- Decklist sidebar (fixed width, collapsible) ---------- */
    .decklist-sidebar {
      width: 340px;
      flex-shrink: 0;
      background-color: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.18s ease, padding 0.18s ease, border-width 0.18s ease;
    }

    .decklist-sidebar > .decklist-inner {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      overflow: hidden;
      min-width: 0;
    }

    .decklist-sidebar.collapsed {
      width: 0;
      border-left-width: 0;
      padding: 0;
    }

    .decklist-toggle-tab {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
      display: none;
    }
    .decklist-toggle-tab.visible { display: block; }
    .decklist-toggle-tab:hover { background: var(--accent-hover); }

    .decklist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .collapse-btn {
      background: #2a2a2a;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .collapse-btn:hover { background: #3a3a3a; border-color: #555; }

    .resize-handle {
      width: 6px;
      cursor: col-resize;
      background: transparent;
      flex-shrink: 0;
      position: relative;
      z-index: 5;
    }
    .resize-handle::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 2px;
      width: 2px;
      background: var(--border-color);
      transition: background 0.15s ease;
    }
    .resize-handle:hover::after,
    .resize-handle.dragging::after { background: var(--accent-color); }

    .target-selector {
      display: flex;
      background: #121212;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px;
      gap: 3px;
      flex-wrap: wrap;
    }

    .target-btn {
      flex: 1 1 30%;
      min-width: 90px;
      background: transparent;
      border: none;
      color: #888;
      padding: 8px 4px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .target-btn[data-target="main"].active { background-color: var(--color-main); color: #000; }
    .target-btn[data-target="reinf"].active { background-color: var(--color-reinf); color: #000; }
    .target-btn[data-target="side"].active { background-color: var(--color-side); color: #000; }

    .deck-items {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .deck-section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-color);
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
      margin-bottom: 6px;
      margin-top: 4px;
    }

    .deck-entry {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      background-color: #262626;
      border-radius: 4px;
      border: 1px solid #333;
      margin-bottom: 4px;
    }

    .deck-qty { font-weight: bold; color: var(--accent-color); min-width: 20px; font-size: 12px; flex-shrink: 0; }
    .deck-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-size: 12px; min-width: 0; }
    .deck-number { color: #888; font-size: 10px; margin-left: 3px; }
    .deck-name:hover { text-decoration: underline; color: #fff; }

    .deck-entry-controls { display: flex; gap: 3px; flex-shrink: 0; }
    .deck-entry-controls button {
      background-color: #3a3a3a;
      color: #fff;
      border: none;
      width: 20px;
      height: 20px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }

    .deck-entry-controls button:hover { background-color: var(--accent-color); color: #000; }

    .btn {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn:hover { background-color: var(--accent-hover); }

    .btn-secondary {
      background-color: #2a2a2a;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover { background-color: #3a3a3a; border-color: #555; }

    .btn-row { display: flex; gap: 6px; }
    .btn-row > * { flex: 1; }

    .mobile-tabs {
      display: none;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 6px;
      gap: 6px;
    }
    .mobile-tabs button {
      flex: 1;
      background: #2a2a2a;
      color: #aaa;
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .mobile-tabs button.active {
      background: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
    }

    @media (max-width: 820px) {
      header { padding: 8px 10px; gap: 8px; }
      header .filter-group { flex: 1 1 100%; }
      header .filter-group input,
      header .filter-group select { width: 100%; }

      .app-container { flex-direction: column; }

      .mobile-tabs { display: flex; }

      .card-inspector,
      .decklist-sidebar,
      .card-browser {
        width: 100% !important;
        max-width: 100%;
        min-width: 0;
        border-left: none;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }

      .decklist-sidebar.collapsed { width: 100% !important; border-bottom-width: 1px; }

      .card-inspector,
      .decklist-sidebar { display: none; }

      .app-container[data-mobile-view="inspector"] .card-inspector { display: flex; }
      .app-container[data-mobile-view="inspector"] .card-browser,
      .app-container[data-mobile-view="inspector"] .decklist-sidebar { display: none; }

      .app-container[data-mobile-view="deck"] .decklist-sidebar { display: flex; }
      .app-container[data-mobile-view="deck"] .card-browser,
      .app-container[data-mobile-view="deck"] .card-inspector { display: none; }

      .app-container[data-mobile-view="browser"] .card-browser { display: block; }
      .app-container[data-mobile-view="browser"] .card-inspector,
      .app-container[data-mobile-view="browser"] .decklist-sidebar { display: none; }

      .card-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }

      .resize-handle { display: none; }
      .decklist-toggle-tab { display: none !important; }
      .collapse-btn { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="filter-group">
      <label for="search-input">Search:</label>
      <input type="text" id="search-input" placeholder="Name, Card #, or ID..." oninput="filterCards()" />
    </div>

    <div class="filter-group">
      <label for="type-filter">Type:</label>
      <select id="type-filter" onchange="filterCards()">
        <option value="ALL">All Types</option>
        <option value="Ninja">Ninja</option>
        <option value="Jutsu">Jutsu</option>
        <option value="Mission">Mission</option>
        <option value="Client">Client</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="set-filter">Set:</label>
      <select id="set-filter" onchange="filterCards()">
        <option value="ALL">All Sets</option>
      </select>
    </div>
  </header>

  <div class="mobile-tabs">
    <button data-view="browser" class="active" onclick="setMobileView('browser')">Cards</button>
    <button data-view="inspector" onclick="setMobileView('inspector')">Inspector</button>
    <button data-view="deck" onclick="setMobileView('deck')">Deck <span id="mobile-deck-count"></span></button>
  </div>

  <div class="app-container" data-mobile-view="browser">

    <aside class="card-inspector" id="panel-inspector">
      <h3>Card Inspector</h3>
      <div id="inspector-content">
        <p class="placeholder-text">Click any card to view stats and text</p>
      </div>
    </aside>

    <div class="resize-handle" id="handle-left" data-target="inspector"></div>

    <section class="card-browser" id="card-browser">
      <div id="card-grid" class="card-grid"></div>
    </section>

    <button class="decklist-toggle-tab" id="decklist-toggle-tab" onclick="toggleDecklist()">◀ Show Deck</button>

    <aside class="decklist-sidebar" id="panel-deck">
      <div class="decklist-inner">
        <div class="decklist-header">
          <h3 style="margin: 0;">Deck <span id="deck-count">0</span></h3>
          <button class="collapse-btn" onclick="toggleDecklist()">Hide ▶</button>
        </div>

        <div class="target-selector">
          <button id="target-main" data-target="main" class="target-btn active" onclick="setAddTarget('main')">+ Mainboard</button>
          <button id="target-reinf" data-target="reinf" class="target-btn" onclick="setAddTarget('reinf')">+ Reinforcements</button>
          <button id="target-side" data-target="side" class="target-btn" onclick="setAddTarget('side')">+ Sideboard</button>
        </div>

        <div class="btn-row">
          <button onclick="exportToTTS()" class="btn">Export TTS</button>
          <button onclick="exportTextDeck()" class="btn btn-secondary">Export Text</button>
        </div>

        <div class="btn-row">
          <label class="btn btn-secondary" style="font-size: 11px; padding: 6px;">
            Import JSON
            <input type="file" id="json-import-input" accept=".json" onchange="importJSONDeck(event)" style="display: none;" />
          </label>

          <button onclick="importTextDeckPrompt()" class="btn btn-secondary" style="font-size: 11px; padding: 6px;">
            Import Text
          </button>
        </div>

        <div id="deck-items" class="deck-items"></div>
      </div>
    </aside>

  </div>

  <script>
    // ============================================================
    // DATA SOURCE: narutoccgdatabase.json
    // Schema (Title Case keys) is defined in PROJECT_HANDOFF.md.
    // cards.json / sets.json are no longer read by this page.
    // ============================================================

    // INSPECTOR MODE
    // true  = the 13-row layout specced for the new database
    // false = same layout, plus Year / Keywords / Errata at the end
    // Change this line and refresh to switch.
    const MINIMAL_INSPECTOR = true;

    const COLOR_MAIN = '#ff9800';
    const COLOR_REINF = '#4fc3f7';
    const COLOR_SIDE = '#f48fb1';

    // ---- Field map: internal name -> key in narutoccgdatabase.json ----
    const F = {
      cardId:          'Card ID',
      collectorNumber: 'Collector Number',
      name:            'Display Name',
      type:            'Type',
      set:             'Set',
      year:            'Year',
      symbols:         'Symbols',
      entranceCost:    'Entrance Cost',
      handCost:        'Hand Cost',
      healthyCombat:   'Healthy Combat',
      healthySupport:  'Healthy Support',
      injuredCombat:   'Injured Combat',
      injuredSupport:  'Injured Support',
      combatAttribute: 'Combat Attribute',
      chakraCost:      'Chakra Cost',
      characteristics: 'Characteristics',
      effectTitle:     'Effect Title',
      effectText:      'Effect Text',
      keywords:        'Keywords',
      errata:          'Errata',
      imagePath:       'image_path',
    };

    let cardDatabase = [];        // flat array of master-DB card objects
    let cardIndex = new Map();    // lowercased Card ID -> card
    let setFolders = [];          // [{folder, display}] derived from image_path + Set

    let currentDeck = { main: {}, reinf: {}, side: {} };

    let activeAddTarget = 'main';
    let currentInspectedCardId = null;
    let lastInspectedCard = null;
    let decklistRenderPending = false;

    // ---------- small helpers ----------
    function isBlank(v) {
      return v === null || v === undefined || v === '';
    }

    // Renders 0.0 -> "0", 1.5 -> "1.5", null/"" -> "" (caller decides to skip)
    function fmtNum(v) {
      if (isBlank(v)) return '';
      const n = Number(v);
      if (!Number.isFinite(n)) return String(v);
      return Number.isInteger(n) ? String(n) : String(n);
    }

    function getSetFolder(card) {
      const p = card[F.imagePath];
      if (!p || typeof p !== 'string') return '';
      const idx = p.indexOf('/');
      return idx === -1 ? '' : p.slice(0, idx);
    }

    // ---------- Mobile view switching ----------
    function setMobileView(view) {
      document.querySelector('.app-container').setAttribute('data-mobile-view', view);
      document.querySelectorAll('.mobile-tabs button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
    }
    window.setMobileView = setMobileView;

    // ---------- Collapsible decklist ----------
    function toggleDecklist() {
      const panel = document.getElementById('panel-deck');
      const tab = document.getElementById('decklist-toggle-tab');
      panel.classList.toggle('collapsed');
      const isCollapsed = panel.classList.contains('collapsed');
      tab.classList.toggle('visible', isCollapsed);
    }
    window.toggleDecklist = toggleDecklist;

    // ---------- Resizable inspector panel (not persisted) ----------
    (function initResize() {
      const inspector = document.getElementById('panel-inspector');
      const handle = document.getElementById('handle-left');

      const MIN_INSPECTOR = 240;
      const MAX_INSPECTOR = () => Math.min(900, window.innerWidth * 0.7);

      let startX = 0, startWidth = 0;

      handle.addEventListener('mousedown', (e) => {
        if (window.innerWidth <= 820) return;
        e.preventDefault();
        startX = e.clientX;
        startWidth = inspector.offsetWidth;
        handle.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';

        function onMove(ev) {
          const dx = ev.clientX - startX;
          let newWidth = startWidth + dx;
          newWidth = Math.max(MIN_INSPECTOR, Math.min(MAX_INSPECTOR(), newWidth));
          inspector.style.width = newWidth + 'px';
        }

        function onUp() {
          handle.classList.remove('dragging');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    })();

    // ---------- Scroll browser to top when filters change ----------
    function scrollBrowserToTop() {
      const browser = document.getElementById('card-browser');
      if (browser) browser.scrollTop = 0;
    }

    function setAddTarget(target) {
      if (activeAddTarget === target) return;
      activeAddTarget = target;
      document.getElementById('target-main').classList.toggle('active', target === 'main');
      document.getElementById('target-reinf').classList.toggle('active', target === 'reinf');
      document.getElementById('target-side').classList.toggle('active', target === 'side');
    }

    function getCardImageUrl(card) {
      const rel = card[F.imagePath];
      if (!rel) return '';
      return `./cards_database/${rel}`;
    }

    // Stable key for deck pools: lowercased Card ID
    function cardKey(card) {
      const id = card[F.cardId];
      return id ? String(id).toLowerCase() : '';
    }

    // ---------- Load & normalize ----------
    async function initApp() {
      try {
        const res = await fetch('narutoccgdatabase.json');
        if (!res.ok) throw new Error(`HTTP ${res.status} for narutoccgdatabase.json`);
        const raw = await res.json();

        // Flatten {sheet_name: [cards...]} into one array
        cardDatabase = [];
        if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
          Object.values(raw).forEach(arr => {
            if (Array.isArray(arr)) cardDatabase.push(...arr);
          });
        } else if (Array.isArray(raw)) {
          cardDatabase = raw;
        }

        // Build lookup by lowercased Card ID
        cardIndex = new Map();
        cardDatabase.forEach(c => {
          const k = cardKey(c);
          if (k && !cardIndex.has(k)) cardIndex.set(k, c);
        });

        buildSetFolders();
        populateSetFilter();
        filterCards();
      } catch (err) {
        console.error("Failed to load narutoccgdatabase.json:", err);
        document.getElementById('card-grid').innerHTML =
          `<p style="color:#f88; padding:20px;">Failed to load narutoccgdatabase.json — check the console and confirm the file is present at the project root.</p>`;
      }
    }

    // Derive one entry per set folder, display name from the card's "Set"
    function buildSetFolders() {
      const byFolder = new Map();
      cardDatabase.forEach(c => {
        const folder = getSetFolder(c);
        if (!folder) return;
        if (!byFolder.has(folder)) {
          byFolder.set(folder, c[F.set] || folder.replace(/_/g, ' '));
        }
      });
      setFolders = Array.from(byFolder.entries()).map(([folder, display]) => ({ folder, display }));
    }

    function populateSetFilter() {
      const setSelect = document.getElementById('set-filter');
      setSelect.innerHTML = '<option value="ALL">All Sets</option>';
      setFolders.forEach(({ folder, display }) => {
        const opt = document.createElement('option');
        opt.value = folder;
        opt.textContent = display;
        setSelect.appendChild(opt);
      });
    }

    // ---------- Filtering ----------
    function getFilteredCards() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const selectedSet = document.getElementById('set-filter').value;
      const selectedType = document.getElementById('type-filter').value;

      return cardDatabase.filter(card => {
        const name  = (card[F.name] || '').toLowerCase();
        const num   = (card[F.collectorNumber] || '').toLowerCase();
        const id    = (card[F.cardId] || '').toLowerCase();

        const matchesQuery = !query
          || name.includes(query)
          || num.includes(query)
          || id.includes(query);

        const matchesSet = (selectedSet === 'ALL') || (getSetFolder(card) === selectedSet);
        const matchesType = (selectedType === 'ALL')
          || ((card[F.type] || '').toLowerCase() === selectedType.toLowerCase());

        return matchesQuery && matchesSet && matchesType;
      });
    }

    function filterCards() {
      renderCards(getFilteredCards());
      scrollBrowserToTop();
    }

    // ---------- Quantity badge on card tiles ----------
    function getFormattedQtyHTML(key) {
      const mainCount  = currentDeck.main[key]  ? currentDeck.main[key].count  : 0;
      const reinfCount = currentDeck.reinf[key] ? currentDeck.reinf[key].count : 0;
      const sideCount  = currentDeck.side[key]  ? currentDeck.side[key].count  : 0;

      const parts = [];
      if (mainCount > 0)  parts.push(`<span style="color: ${COLOR_MAIN};">x${mainCount}</span>`);
      if (reinfCount > 0) parts.push(`<span style="color: ${COLOR_REINF};">x${reinfCount}</span>`);
      if (sideCount > 0)  parts.push(`<span style="color: ${COLOR_SIDE};">x${sideCount}</span>`);

      return parts.join('<span style="color: #666; font-weight: normal;"> / </span>');
    }

    // ---------- Card grid ----------
    function renderCards(cardsToRender) {
      const grid = document.getElementById('card-grid');
      grid.innerHTML = '';

      cardsToRender.forEach(card => {
        const key = cardKey(card);
        const cardEl = document.createElement('div');
        cardEl.className = 'card-item';
        cardEl.setAttribute('data-card-key', key);
        cardEl.onclick = () => inspectCard(card);

        cardEl.innerHTML = `
          <img src="${getCardImageUrl(card)}" alt="${card[F.name] || ''}" loading="lazy" width="750" height="1050" />
          <div class="card-controls" onclick="event.stopPropagation()">
            <button onclick="removeCard('${key}', activeAddTarget)">-</button>
            <span class="card-qty">${getFormattedQtyHTML(key)}</span>
            <button onclick="addCard('${key}', activeAddTarget)">+</button>
          </div>
        `;
        grid.appendChild(cardEl);
      });
    }

    function updateSingleCardQty(key) {
      const tile = document.querySelector(`[data-card-key="${key}"]`);
      if (!tile) return;
      const qtySpan = tile.querySelector('.card-qty');
      if (qtySpan) qtySpan.innerHTML = getFormattedQtyHTML(key);
    }

    // ---------- Deck mutators ----------
    function scheduleDecklistRender() {
      if (decklistRenderPending) return;
      decklistRenderPending = true;
      requestAnimationFrame(() => {
        renderDecklist();
        decklistRenderPending = false;
      });
    }

    function addCard(key, target = activeAddTarget) {
      const card = cardIndex.get(key);
      if (!card) return;

      const pool = currentDeck[target];
      if (pool[key]) pool[key].count += 1;
      else pool[key] = { card, count: 1 };

      scheduleDecklistRender();
      updateSingleCardQty(key);
    }

    function removeCard(key, target = activeAddTarget) {
      const pool = currentDeck[target];
      if (!pool[key]) return;

      pool[key].count -= 1;
      if (pool[key].count <= 0) delete pool[key];

      scheduleDecklistRender();
      updateSingleCardQty(key);
    }

    // ---------- Inspector ----------
    function inspectCard(card) {
      if (!card) return;
      const key = cardKey(card);
      if (currentInspectedCardId === key) return;
      currentInspectedCardId = key;
      lastInspectedCard = card;
      renderInspector();
      if (window.innerWidth <= 820) setMobileView('inspector');
    }

    // Build a single row <p><strong>Label:</strong> value</p>, or '' if blank
    function row(label, value) {
      if (isBlank(value)) return '';
      return `<p><strong>${label}:</strong> ${value}</p>`;
    }

    function statRow(leftLabel, leftVal, rightLabel, rightVal) {
      const l = isBlank(leftVal) ? '-' : leftVal;
      const r = isBlank(rightVal) ? '-' : rightVal;
      return `<div class="stat-row"><span><strong>${leftLabel}:</strong> ${l}</span><span><strong>${rightLabel}:</strong> ${r}</span></div>`;
    }

    function renderInspector() {
      const card = lastInspectedCard;
      if (!card) return;

      const inspector = document.getElementById('inspector-content');
      const type = (card[F.type] || '').trim();
      const typeLc = type.toLowerCase();

      const isNinja   = typeLc === 'ninja';
      const isJutsu   = typeLc === 'jutsu';
      const isMission = typeLc === 'mission';
      const isClient  = typeLc === 'client';

      const name    = card[F.name] || '';
      const symbols = card[F.symbols];
      const chars   = card[F.characteristics];
      const ent     = card[F.entranceCost];
      const hand    = card[F.handCost];
      const hc      = card[F.healthyCombat];
      const hs      = card[F.healthySupport];
      const ic      = card[F.injuredCombat];
      const is      = card[F.injuredSupport];
      const attr    = card[F.combatAttribute];
      const chakra  = card[F.chakraCost];
      const eTitle  = card[F.effectTitle];
      const eText   = card[F.effectText];
      const num     = card[F.collectorNumber];
      const set     = card[F.set];

      let html = `<img src="${getCardImageUrl(card)}" class="inspector-img" alt="${name}" />`;
      html += `<div class="inspector-details">`;

      // 1. Name
      html += `<h4>${name || 'Unknown'}</h4>`;

      // 2. Type
      html += row('Type', type);

      // 3. Symbols
      html += row('Symbols', symbols);

      // 4. Characteristics — Ninja, Client
      if (isNinja || isClient) html += row('Characteristics', chars);

      // 5. Entrance Cost — Ninja, Mission, Client
      if (isNinja || isMission || isClient) html += row('Entrance Cost', fmtNum(ent));

      // 6. Hand Cost — Ninja, Mission, Client
      if (isNinja || isMission || isClient) html += row('Hand Cost', fmtNum(hand));

      // 7. Healthy stats — Ninja
      if (isNinja && !(isBlank(hc) && isBlank(hs))) {
        html += statRow('Combat (Healthy)', fmtNum(hc), 'Support (Healthy)', fmtNum(hs));
      }

      // 8. Injured stats — Ninja
      if (isNinja && !(isBlank(ic) && isBlank(is))) {
        html += statRow('Combat (Injured)', fmtNum(ic), 'Support (Injured)', fmtNum(is));
      }

      // 9. Combat Attribute — Ninja
      if (isNinja) html += row('Combat Attribute', attr);

      // 10. Jutsu Cost — Jutsu
      if (isJutsu) html += row('Jutsu Cost', chakra);

      // 11. Effect — all types
      //     [EFFECT TITLE UPPERCASED] then Effect Text (line breaks preserved)
      if (!isBlank(eTitle) || !isBlank(eText)) {
        let effectHtml = '<div class="effect-block">';
        if (!isBlank(eTitle)) {
          effectHtml += `<span class="effect-title">[${String(eTitle).toUpperCase()}]</span>`;
        }
        if (!isBlank(eText)) {
          effectHtml += String(eText);
        }
        effectHtml += '</div>';
        html += effectHtml;
      }

      // 12. Card Number — all types
      html += row('Card Number', num);

      // 13. Set — all types
      html += row('Set', set);

      // Optional extras when MINIMAL_INSPECTOR is false
      if (!MINIMAL_INSPECTOR) {
        html += row('Year', fmtNum(card[F.year]));
        html += row('Keywords', card[F.keywords]);
        html += row('Errata', card[F.errata]);
      }

      html += `</div>`;
      inspector.innerHTML = html;
    }

    // ---------- Decklist rendering ----------
    function renderDecklist() {
      const container = document.getElementById('deck-items');
      const countEl = document.getElementById('deck-count');
      container.innerHTML = '';

      let mainTotal = 0;
      let reinfTotal = 0;
      let sideTotal = 0;

      const entryHTML = (entry, key, targetKey, badgeColor) => {
        const displayName = entry.card[F.name] || entry.card[F.collectorNumber] || key;
        const num = entry.card[F.collectorNumber] || '';
        return `
          <div class="deck-entry">
            <span class="deck-qty" style="color: ${badgeColor}">${entry.count}x</span>
            <span class="deck-name" onclick="inspectCard(cardIndex.get('${key}'))">
              ${displayName} <span class="deck-number">[${num}]</span>
            </span>
            <div class="deck-entry-controls">
              <button onclick="removeCard('${key}', '${targetKey}')">-</button>
              <button onclick="addCard('${key}', '${targetKey}')">+</button>
            </div>
          </div>
        `;
      };

      // Mainboard grouped by Type (guaranteed to be one of the four)
      const groups = { 'Ninja': [], 'Jutsu': [], 'Mission': [], 'Client': [] };

      Object.entries(currentDeck.main).forEach(([key, entry]) => {
        mainTotal += entry.count;
        const t = (entry.card[F.type] || '').trim();
        if (groups[t]) groups[t].push([key, entry]);
        // Stray types are dropped from grouping but still counted above.
        // Given the DB guarantees four types, this branch is defensive only.
      });

      ['Ninja', 'Jutsu', 'Mission', 'Client'].forEach(type => {
        const entries = groups[type];
        if (entries.length === 0) return;
        const catCount = entries.reduce((sum, [, e]) => sum + e.count, 0);
        const header = document.createElement('div');
        header.className = 'deck-section-title';
        header.style.color = COLOR_MAIN;
        header.innerText = `${type}s (${catCount})`;
        container.appendChild(header);

        entries.forEach(([key, entry]) => {
          const div = document.createElement('div');
          div.innerHTML = entryHTML(entry, key, 'main', COLOR_MAIN);
          container.appendChild(div.firstElementChild);
        });
      });

      const reinfEntries = Object.entries(currentDeck.reinf);
      reinfTotal = reinfEntries.reduce((sum, [, e]) => sum + e.count, 0);
      if (reinfEntries.length > 0 || activeAddTarget === 'reinf') {
        const header = document.createElement('div');
        header.className = 'deck-section-title';
        header.style.color = COLOR_REINF;
        header.innerText = `Reinforcements (${reinfTotal})`;
        container.appendChild(header);

        reinfEntries.forEach(([key, entry]) => {
          const div = document.createElement('div');
          div.innerHTML = entryHTML(entry, key, 'reinf', COLOR_REINF);
          container.appendChild(div.firstElementChild);
        });
      }

      const sideEntries = Object.entries(currentDeck.side);
      sideTotal = sideEntries.reduce((sum, [, e]) => sum + e.count, 0);
      if (sideEntries.length > 0 || activeAddTarget === 'side') {
        const header = document.createElement('div');
        header.className = 'deck-section-title';
        header.style.color = COLOR_SIDE;
        header.innerText = `Sideboard (${sideTotal})`;
        container.appendChild(header);

        sideEntries.forEach(([key, entry]) => {
          const div = document.createElement('div');
          div.innerHTML = entryHTML(entry, key, 'side', COLOR_SIDE);
          container.appendChild(div.firstElementChild);
        });
      }

      const countParts = [`<span style="color: ${COLOR_MAIN};">${mainTotal}</span>`];
      if (reinfTotal > 0 || activeAddTarget === 'reinf') countParts.push(`<span style="color: ${COLOR_REINF};">${reinfTotal}</span>`);
      if (sideTotal > 0  || activeAddTarget === 'side')  countParts.push(`<span style="color: ${COLOR_SIDE};">${sideTotal}</span>`);
      countEl.innerHTML = countParts.join('<span style="color: #666; font-weight: normal;"> / </span>');

      const mobileCount = document.getElementById('mobile-deck-count');
      if (mobileCount) mobileCount.textContent = `(${mainTotal + reinfTotal + sideTotal})`;
    }

    function updateUI() {
      scheduleDecklistRender();
      renderCards(getFilteredCards());
    }

    // ---------- Export: TTS ----------
    function exportToTTS() {
      const allMainCards = [];
      Object.values(currentDeck.main).forEach(entry => {
        for (let i = 0; i < entry.count; i++) allMainCards.push(entry.card);
      });

      if (allMainCards.length === 0) {
        alert("Mainboard is empty!");
        return;
      }

      const baseURL = window.location.origin + window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
      const cardBackURL = `${baseURL}/cardback.webp`;

      const createTTSDeckObject = (cardList, deckName) => {
        const customDeckDict = {};
        const containedObjects = [];
        const deckIDs = [];

        cardList.forEach((card, index) => {
          const deckKey = index + 1;
          const cardId = deckKey * 100;
          const rel = card[F.imagePath] || '';
          const cleanRel = rel.replace(/^\.\//, '');
          const fullImageUrl = `${baseURL}/cards_database/${cleanRel}`;

          deckIDs.push(cardId);
          customDeckDict[deckKey] = {
            "FaceURL": fullImageUrl,
            "BackURL": cardBackURL,
            "NumWidth": 1, "NumHeight": 1,
            "BackIsHidden": true, "UniqueBack": false
          };

          containedObjects.push({
            "Name": "Card",
            "Transform": { "posX": 0, "posY": 0, "posZ": 0, "rotX": 0, "rotY": 180, "rotZ": 180, "scaleX": 1.25, "scaleY": 1, "scaleZ": 1.25 },
            "Nickname": card[F.name] || card[F.collectorNumber] || '',
            "Description": cardKey(card),
            "CardID": cardId,
            "CustomDeck": { [deckKey]: customDeckDict[deckKey] }
          });
        });

        return {
          "Name": "DeckCustom",
          "Nickname": deckName,
          "Transform": { "posX": 0, "posY": 1, "posZ": 0, "rotX": 0, "rotY": 180, "rotZ": 180, "scaleX": 1.25, "scaleY": 1, "scaleZ": 1.25 },
          "DeckIDs": deckIDs,
          "CustomDeck": customDeckDict,
          "ContainedObjects": containedObjects
        };
      };

      const objectStates = [createTTSDeckObject(allMainCards, "Mainboard")];

      const reinfCards = [];
      Object.values(currentDeck.reinf).forEach(entry => {
        for (let i = 0; i < entry.count; i++) reinfCards.push(entry.card);
      });
      if (reinfCards.length > 0) objectStates.push(createTTSDeckObject(reinfCards, "Reinforcements"));

      const sideCards = [];
      Object.values(currentDeck.side).forEach(entry => {
        for (let i = 0; i < entry.count; i++) sideCards.push(entry.card);
      });
      if (sideCards.length > 0) objectStates.push(createTTSDeckObject(sideCards, "Sideboard"));

      const ttsSaveObject = { "SaveName": "", "GameMode": "", "Date": "", "ObjectStates": objectStates };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(ttsSaveObject, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", "naruto_deck.json");
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    // ---------- Export: plain text ----------
    function exportTextDeck() {
      let textData = "// Mainboard\n";
      Object.entries(currentDeck.main).forEach(([key, entry]) => {
        const n = entry.card[F.name] || entry.card[F.collectorNumber] || key;
        textData += `${entry.count}x ${n} [${key}]\n`;
      });

      if (Object.keys(currentDeck.reinf).length > 0) {
        textData += "\n// Reinforcements\n";
        Object.entries(currentDeck.reinf).forEach(([key, entry]) => {
          const n = entry.card[F.name] || entry.card[F.collectorNumber] || key;
          textData += `${entry.count}x ${n} [${key}]\n`;
        });
      }

      if (Object.keys(currentDeck.side).length > 0) {
        textData += "\n// Sideboard\n";
        Object.entries(currentDeck.side).forEach(([key, entry]) => {
          const n = entry.card[F.name] || entry.card[F.collectorNumber] || key;
          textData += `${entry.count}x ${n} [${key}]\n`;
        });
      }

      const blob = new Blob([textData], { type: 'text/plain;charset=utf-8' });
      const anchor = document.createElement('a');
      anchor.href = URL.createObjectURL(blob);
      anchor.download = "naruto_decklist.txt";
      anchor.click();
      anchor.remove();
    }

    // ---------- Import: TTS JSON ----------
    function importJSONDeck(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          currentDeck = { main: {}, reinf: {}, side: {} };

          if (data.ObjectStates) {
            data.ObjectStates.forEach(deckObj => {
              let targetKey = 'main';
              if (deckObj.Nickname === 'Reinforcements') targetKey = 'reinf';
              if (deckObj.Nickname === 'Sideboard')      targetKey = 'side';

              if (deckObj.ContainedObjects) {
                deckObj.ContainedObjects.forEach(obj => {
                  // Description is the lowercased Card ID we wrote on export,
                  // but we also accept older files where it was the lowercase cardnumber.
                  const desc = (obj.Description || '').toLowerCase();
                  const matched = cardIndex.get(desc);
                  if (matched) {
                    const key = cardKey(matched);
                    const pool = currentDeck[targetKey];
                    if (pool[key]) pool[key].count += 1;
                    else pool[key] = { card: matched, count: 1 };
                  }
                });
              }
            });
            updateUI();
          } else {
            alert("Unrecognized JSON format.");
          }
          event.target.value = '';
        } catch (err) {
          alert("Error parsing JSON: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    // ---------- Import: text ----------
    function importTextDeckPrompt() {
      const input = prompt("Paste your decklist here (supports section headers like // Sideboard):");
      if (!input) return;

      currentDeck = { main: {}, reinf: {}, side: {} };
      let currentSection = 'main';
      const lines = input.split('\n');

      lines.forEach(line => {
        const cleanLine = line.trim();
        if (!cleanLine) return;

        const lower = cleanLine.toLowerCase();
        if (lower.includes('reinforcement')) { currentSection = 'reinf'; return; }
        if (lower.includes('sideboard'))     { currentSection = 'side';  return; }
        if (lower.includes('main'))          { currentSection = 'main';  return; }

        // Formats accepted:
        //   3x Card Name [cardid]
        //   3 Card Name [cardid]
        //   3x Card Name
        const match = cleanLine.match(/^(\d+)x?\s+(.+?)(?:\s+\[(.*?)\])?$/i);
        if (!match) return;

        const qty = parseInt(match[1], 10);
        const namePart = match[2].trim().toLowerCase();
        const idPart = match[3] ? match[3].trim().toLowerCase() : null;

        let matched = null;
        if (idPart) matched = cardIndex.get(idPart);
        if (!matched && idPart) {
          // fall back: maybe they used the Collector Number in brackets
          matched = cardDatabase.find(c =>
            (c[F.collectorNumber] || '').toLowerCase() === idPart
          );
        }
        if (!matched) {
          matched = cardDatabase.find(c =>
            (c[F.name] || '').toLowerCase() === namePart
          );
        }

        if (matched) {
          const key = cardKey(matched);
          const pool = currentDeck[currentSection];
          if (pool[key]) pool[key].count += qty;
          else pool[key] = { card: matched, count: qty };
        }
      });

      updateUI();
    }

    window.onload = initApp;
  </script>
